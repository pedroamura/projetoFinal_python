<!DOCTYPE html>

<html>

<head>
    <title>Agendamento de Sala</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h2>Grade Horária Semanal</h2>

    <table id="tabela">
        <thead>
            <tr>
                <th>Tempo</th>
                {% for dia in dias %}
                <th>{{ dia }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for tempo in tempos %}
            <tr>
                <td><strong>{{ tempo }}º Tempo</strong></td>
                {% for dia in dias %}
                {% if (dia, tempo) in agendamentos %}
                <td class="ocupado">
                    Ocupado por:<br>
                    <strong>{{ agendamentos[(dia, tempo)] }}</strong>
                </td>
                {% else %}
                <td class="livre">Livre</td>
                {% endif %}
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br>
    <form action="/limpar-tudo" method="POST">
        <button type="submit" onclick="return confirm('Tem certeza que deseja apagar TODOS os agendamentos?')">Limpar a Grade</button>
    </form>
    <br>
    <button onclick="div_agenda()">AGENDAR</button>
    <br>
    <div id="agendamento">
        <form action="/agendar" method="POST">
            <select id="dia_semana" name="dia_semana">
                {% for dia in dias %}
                <option value="{{ dia }}">{{ dia }}</option>
                {% endfor %}
            </select>
            <br>
            <input type="number" name="tempo" min="1" max="7" placeholder="N° do tempo (1-7)" required>
            <br>
            <input type="text" name="professor_nome" placeholder="Seu nome" required>
            <br>
            <input type="text" name="motivo" placeholder="Aula/Motivo" required>
            <br>
            <button type="submit" onclick="some_agendamento()">Reservar</button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
